<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registration Forms</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }
        .form-section {
            margin-bottom: 3rem;
            padding: 2rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
        }
        .form-section h2 {
            color: #374151;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        .form-label i {
            margin-right: 0.5rem;
            color: #6b7280;
        }
        .form-input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            padding: 0.875rem 1.25rem;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
        }
        .alert {
            padding: 0.875rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            border: 1px solid;
        }
        .alert-warning {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #374151; margin-bottom: 2rem;">
            <i class="fas fa-user-plus"></i> Registration Forms Test
        </h1>
        
        <!-- Student Form Section -->
        <div class="form-section">
            <h2><i class="fas fa-user-graduate"></i> Student Registration Form</h2>
            <div id="studentFormContainer">
                <p>Loading student form...</p>
            </div>
        </div>
        
        <!-- Teacher Form Section -->
        <div class="form-section">
            <h2><i class="fas fa-chalkboard-teacher"></i> Teacher Registration Form</h2>
            <div id="teacherFormContainer">
                <p>Loading teacher form...</p>
            </div>
        </div>
    </div>

    <script>
        // Load forms directly
        async function loadForm(role, containerId) {
            try {
                const response = await fetch(`forms/${role}-form.php`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const html = await response.text();
                document.getElementById(containerId).innerHTML = html;
                console.log(`${role} form loaded successfully`);
            } catch (error) {
                console.error(`Error loading ${role} form:`, error);
                document.getElementById(containerId).innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        Error loading ${role} form: ${error.message}
                    </div>
                `;
            }
        }

        // Load both forms when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadForm('student', 'studentFormContainer');
            loadForm('teacher', 'teacherFormContainer');
        });
    </script>
</body>
</html>
